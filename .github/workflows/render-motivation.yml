name: Render motivation reel

# n8n commits motivation/src/<id>.jpg + <id>.mp3, then motivation/jobs/<id>.json.
# This turns them into motivation/<id>.mp4 (1080x1920, slow push-in, faded audio)
# and commits it so GitHub Pages serves it for Instagram/Facebook/YouTube.

on:
  push:
    branches: [main]
    paths: ['motivation/jobs/*.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render-motivation
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install ffmpeg
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Render pending jobs
        run: |
          set -e
          shopt -s nullglob
          made=0
          for job in motivation/jobs/*.json; do
            id=$(jq -r '.id' "$job")
            [[ "$id" =~ ^[a-z0-9-]+$ ]] || { echo "bad id in $job"; continue; }
            out="motivation/$id.mp4"
            [ -f "$out" ] && continue
            img="motivation/src/$id.jpg"; aud="motivation/src/$id.mp3"
            [ -f "$img" ] && [ -f "$aud" ] || { echo "missing inputs for $id"; continue; }
            dur=$(jq -r '.duration // 15' "$job")
            fade=$(awk "BEGIN{print $dur-1.5}")
            frames=$(( dur * 30 ))
            ffmpeg -y -loglevel error -loop 1 -i "$img" -i "$aud" -filter_complex \
              "[0:v]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,scale=2160:3840,zoompan=z='min(zoom+0.0005,1.07)':d=${frames}:x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':s=1080x1920:fps=30,format=yuv420p[v];[1:a]afade=t=in:d=0.4,afade=t=out:st=${fade}:d=1.5[a]" \
              -map "[v]" -map "[a]" -t "$dur" -c:v libx264 -preset medium -crf 20 -profile:v high -c:a aac -b:a 192k -ar 44100 -movflags +faststart "$out"
            echo "rendered $out"; made=1
          done
          echo "MADE=$made" >> "$GITHUB_ENV"

      - name: Commit videos
        if: env.MADE == '1'
        run: |
          git config user.name "don-reels-bot"
          git config user.email "actions@users.noreply.github.com"
          git add motivation/*.mp4
          git commit -m "render motivation reel"
          for i in 1 2 3; do git pull --rebase origin main && git push origin main && break; sleep 5; done
